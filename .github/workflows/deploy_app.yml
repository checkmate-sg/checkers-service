name: Deploy App
# Trigger on pushes to staging/main when app code changes
on:
  push:
    branches:
      - staging
      - main
    paths:
      - "src/**"
      - "shared/**"
      - "public/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "next.config.ts"
      - "wrangler.jsonc"
      - "open-next.config.ts"
  workflow_dispatch: # Allow manual trigger

jobs:
  deploy:
    name: "Deploy app to ${{ github.ref_name == 'main' && 'production' || github.ref_name }}"
    runs-on: ubuntu-latest
    environment: "${{ github.ref_name == 'main' && 'production' || github.ref_name }}"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2

      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 10.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy:${{ github.ref_name == 'main' && 'production' || github.ref_name }}
