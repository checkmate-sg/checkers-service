openapi: 3.0.4
info:
  title: Checkmate checkers-service
  description: This document describes the Full API interface for Checkmate checkers-service
  version: 1.0.0
  contact:
    name: Ke En
    email: keenlim@checkmate.sg

tags:
  - name: Checkers
    description: API for managing checkers
  - name: Polls
    description: API for managing Polls
  - name: Votes 
    description: API for managing Votes 
  - name: Leaderboard 
    description: API for managing Leaderboard 

paths:
  '/checkers/{checkerId}':
    get:
      summary: Retrieves checkers information based on checkerId
      description: |
       Return all the fields of a checkers based on the checkerId to check if the checkers exist in the database
      tags:
        - Checkers
      parameters:
        - name: checkerId
          in: path
          description: Checker ID 
          required: true 
          schema: 
            type: string
      responses:
        '200':
          description: Successful retrieval of checkers details
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/Checker'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
          
  '/checkers/{checkerId}/votes':
    get:
      summary: Retrieves ALL the Votes details based on checkerId
      description: |
        Return a paginated list of Votes based on the checkerId 
      tags:
        - Checkers
      parameters:
        - name: checkerId
          in: path 
          description: Checker ID
          required: true 
          schema:
            type: string
        # Sorting Value
        - description: sort by value, createTimestamp 
          name: sorting
          in: query
          required: false
          schema: 
            type: string
        # Supports pagination
        - $ref: '#/components/parameters/PaginationLimitParam'
        - $ref: '#/components/parameters/PaginationOffsetParam'
        # Vote isPending? 
        - description: Check if checker have voted 
          name: VoteCheckerStatus
          in: query
          required: true
          schema:
            type: boolean
      responses:
        '200':
          description: Successful retrieval of vote details 
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/APIPagination'
                  - description: List of VoteMessageBrief based on checkerId
                    type: object
                    properties:
                      items:
                        description: List of VoteMessageBrief based on checkerid
                        type: array
                        default: []
                        items:
                          $ref: '#/components/schemas/VotesMessageBrief'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
          
  '/polls/webhook':
    post:
      summary: Create a new poll using the webhook 
      description: |
        Create a poll in the database and disseminate the vote message to ALL active checkers 
      tags:
        - Polls
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PollRequest'
      responses:
        '200':
          description: Poll created succesfully 
          content: 
            application/json:
              schema:
                type: object
                properties:
                  message: 
                    type: string
                    example: Poll created successfully 
                  id: 
                    type: string
                    description: The database identifier of the created poll
        '400':
          $ref: '#/components/responses/InvalidParametersError'
        '409':
          $ref: '#/components/responses/DuplicateEntryError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  
  '/polls/{id}':
    get:
      summary: Retrieve the specific Poll detail
      description: |
        Return all the details of a poll based on the poll's MongoDB _id
      tags:
        - Polls
      parameters:
        - name: id
          in: path
          description: Poll ID (MongoDB ObjectId)
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful retrieval of poll details
          content:
            application/json:
              schema: 
                $ref: '#/components/schemas/Poll'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
          
  '/polls/{id}/results':
    get:
      summary: Get poll statistics by poll ID
      description: Retrieves category counts and truth score statistics for a specific poll
      tags:
        - Polls
      parameters:
        - name: id
          in: path
          description: Poll ID (MongoDB ObjectId)
          required: true
          schema:
            type: string 
      responses:
        '200':
          description: Successfully retrieved poll statistics 
          content:
            application/json:
              schema:
                type: object
                properties:
                  scam:
                    type: integer
                    description: Number of votes categorized as scam
                    example: 0
                  illicit:
                    type: integer
                    description: Number of votes categorized as illicit
                    example: 0
                  info:
                    type: object
                    description: Information category with truth score breakdown
                    properties:
                      total:
                        type: integer
                        description: Total number of info votes
                        example: 1
                      '0':
                        type: integer
                        description: Number of votes with truth score 0
                        example: 0
                      '1':
                        type: integer
                        description: Number of votes with truth score 1
                        example: 0
                      '2':
                        type: integer
                        description: Number of votes with truth score 2
                        example: 0
                      '3':
                        type: integer
                        description: Number of votes with truth score 3
                        example: 0
                      '4':
                        type: integer
                        description: Number of votes with truth score 4
                        example: 1
                      '5':
                        type: integer
                        description: Number of votes with truth score 5
                        example: 0
                  satire:
                    type: integer
                    description: Number of votes categorized as satire
                    example: 0
                  spam:
                    type: integer
                    description: Number of votes categorized as spam
                    example: 0
                  legitimate:
                    type: integer
                    description: Number of votes categorized as legitimate
                    example: 0
                  irrelevant:
                    type: integer
                    description: Number of votes categorized as irrelevant
                    example: 0
                  unsure:
                    type: integer
                    description: Number of votes categorized as unsure
                    example: 0
                  pass:
                    type: integer
                    description: Number of votes that passed
                    example: 0
                  great:
                    type: integer
                    description: Number of votes that voted great
                    example: 0
                  acceptable:
                    type: integer
                    description: Number of votes that voted acceptable
                    example: 0
                  unacceptable:
                    type: integer
                    description: Number of votes that voted unacceptable
                    example: 0
        '400':
          $ref: '#/components/responses/InvalidParametersError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  '/checks/{checkId}/poll':
    get:
      summary: Retrieve poll by external check ID
      description: |
        Return poll details based on the checkId (external ID from CheckMate platform)
      tags:
        - Polls
      parameters:
        - name: checkId
          in: path
          description: Check ID from CheckMate platform
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful retrieval of poll details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Poll'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  '/votes/{voteId}':
    get:
      summary: Retrieve the specific Vote detail
      description: |
        Return the specific Vote detail based on the voteId 
      tags:
        - Votes 
      parameters: 
        - name: voteId 
          in: path
          description: Vote ID 
          required: true 
          schema: 
            type: string 
      responses:
        '200':
          description: Successful retrieval of Vote details 
          content: 
            application/json:
              schema:
                $ref: '#/components/schemas/Vote'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Update the Vote Detail 
      description: | 
        Update the category, truthScore (if any) and responseCategory of the Vote
      tags:
        - Votes
      parameters:
        - name: voteId
          in: path 
          description: Vote ID 
          required: true 
          schema:
            type: string
      requestBody: 
        content:
          application/json:
            schema: 
              $ref: '#/components/schemas/VotePOST'
      responses:
        '201':
          description: Successfully update the category, truthScore (if any) and responseCategory of the Vote 
          content:
            application/json:
                schema:
                  type: object
                  properties:
                    message: 
                      type: string
                      example: Vote successfully updated
                    id: 
                      type: string
                      description: The database identifier of the updated vote 
        '400':
          $ref: '#/components/responses/InvalidParametersError'
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
  
  '/leaderboard':
    get:
      summary: Get leaderboard information 
      description: Retrieves leaderboard data for the current month. 
      tags:
        - Leaderboard 
      responses:
        '200':
          description: Successfully retrieved leaderboard information 
          content: 
            application/json:
              schema:
                type: object 
                properties: 
                  success: 
                    type: boolean
                    example: true 
                  data:
                    type: array
                    items: 
                      $ref: "#/components/schemas/Leaderboard"
        '401':
          $ref: '#/components/responses/AuthenticationError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '500':
          $ref: '#/components/responses/InternalServerError'
        
          
components:
  # Definition of Schemas
  schemas:
    # Common Schemas
    APIError:
      description: Generic schema for expressing API Errors
      type: object
      properties:
        code:
          description: API Error code associated with the error
          type: integer
          format: int32
        message:
          description: Error message associated with the error
          type: string
        request:
          description: Request details associated with the error
          type: object
        details:
          description: Other details associated with the error
          type: object
      required:
        - code
        
    # Primitives & Helpers
    MongoObjectId:
      type: string
      description: MongoDB ObjectId (24 hex characters)
      pattern: "^[a-fA-F0-9]{24}$"
      example: "60f7a7c8d5c5f6b9a1c2d3e4"
    
    ObjectIdString:
      type: string
      description: String representation of an ObjectId
      pattern: "^[a-fA-F0-9]{24}$"
      example: "60f7a7c8d5c5f6b9a1c2d3e4"
      
    DateTime:
      type: string
      format: date-time
      description: ISO-8601 timestamp string
      example: "2025-09-18T12:34:56Z"
    
    BaseDocument:
      type: object
      description: Base document interface that all MongoDB documents extend
      properties:
        _id: 
          $ref: '#/components/schemas/MongoObjectId'
      additionalProperties: false
    
    Category:
      type: string
      description: crowed source message category 
      enum:
        - "scam"
        - "illicit"
        - "info"
        - "untrue"
        - "misleading"
        - "accurate"
        - "satire"
        - "spam"
        - "legitimate"
        - "irrelevant"
        - "unsure"
        - null
    
    CategoryWithPassNullable:
      description: Category including 'pass' and allowing null
      type: string
      enum:
        - "scam"
        - "illicit"
        - "info"
        - "satire"
        - "spam"
        - "legitimate"
        - "irrelevant"
        - "unsure"
        - "pass"
        - null
    
    OnboardingStatus:
      type: string
      description: Onboarding status of the Checker
      enum:
        - name
        - number
        - verify
        - quiz
        - onboardWhatsapp
        - joinGroupChat
        - nlb
        - completed
        - offboarded
        
    ResponseCategory:
      description: Evaluation for an AI response quality (nullable)
      type: string
      enum: 
        - great
        - acceptable
        - unacceptable
        - null
        
    TruthScore:
      description: Truth score on a 0-5 scale 
      type: integer
      minimum: 0
      maximum: 5
      
    Collections:
      type: string
      description: Database collections enum for type safety
      enum: [checkers, polls, votes]
      
    Response:
      type: object
      description: >- 
        Format of the AI generated responses passed from CheckMate AI platform
      required: 
        - en
        - cn 
        - links
        - timestamp
      properties:
        en:
          type: string
          description: English response
        cn:
          type: string
          description: Chinese response
        links:
          type: array
          description: Related links cited by the AI response
          items:
            type: string
            format: uri
        timestamp:
          $ref: '#/components/schemas/DateTime'
      additionalProperties: false
      
    Checker:
      description: Representation of a Checker user. 
      allOf:
        - $ref: '#/components/schemas/BaseDocument'
        - type: object
          properties:
            name:
              type: string
              nullable: true
              description: >-
                Name of the Checker, set by them during onboarding
            telegramId:
              type: string
              description: >-
                Telegram ID of the Checker
            whatsappId:
              type: string
              nullable: true
              description: >-
                Whatsapp ID of the Checker
            singpassId:
              type: string
              nullable: true
              description: >-
                SingPass ID of the Checker (not used yet)
            isActive:
              type: boolean
              description: >-
                Whether the Checker is active and will be triggered
            isOnboardingComplete:
              type: boolean
              description: >-
                Whether the Checker has completed the onboarding process
            onboardingTime:
              $ref: '#/components/schemas/DateTime'
            isQuizComplete:
              type: boolean
              description: >-
                Whether the Checker has completed the onboarding quiz 
            quizScore:
              type: integer
              nullable: true
              description: >-
                The score the Checker got in the quiz 
            onboardingStatus:
              $ref: '#/components/schemas/OnboardingStatus'
            hasReceivedExtension:
              type: boolean
              description: >-
                Whether the Checker has received the extension for the program
            hasCompletedProgramme:
              type: boolean
              description: >-
                Whether the Checker has completed the programme
            certificateUrl: 
              type: string
              nullable: true
              description: >-
                The static URL of the Checker's certificate
            numVoted:
              type: integer
              description: >-
                The number of polls the Checkers has voted on
            lastVotedTimestamp:
              $ref: '#/components/schemas/DateTime'
            getNameMessageId:
              type: string
              nullable: true
              description: >-
                Message ID of the message the Checker used to set their name
            dailyAssignmentCount:
              type: integer
              description: >-
                Number of polls the Checker has been assigned to vote on today
          required:
            - name
            - telegramId
            - whatsappId
            - singpassId
            - isActive
            - isOnboardingComplete
            - onboardingTime
            - isQuizComplete
            - quizScore
            - onboardingStatus
            - hasReceivedExtension
            - hasCompletedProgramme
            - certificateUrl
            - numVoted
            - lastVotedTimestamp
            - getNameMessageId
            - dailyAssignmentCount
    Poll:
      description: >-
        Representation of the Messages to be checked
      allOf:
        - $ref: '#/components/schemas/BaseDocument'
        - type: object
          properties:
            checkId:
              type: string
              description: >-
                Check ID from CheckMate AI platform 
            text: 
              type: string
              nullable: true
              description: >-
                Text of the poll, if any
            imageURL: 
              type: string
              nullable: true
              description: >-
                URL of the image in the poll, if any 
            caption: 
              type: string
              nullable: true 
              description: >-
                Caption of the poll, if any 
            longformResponse: 
              $ref: '#/components/schemas/Response'
            shortformResponse:
              $ref: '#/components/schemas/Response'
            crowdSourcedCategory:
              $ref: '#/components/schemas/Category'
            crowdSourcedTruthScore: 
              type: number
              nullable: true
              description: >-
                Truth score if the category is info/untrue/misleading/accurate
            startedTimestamp:
              $ref: '#/components/schemas/DateTime'
            assessedTimestamp:
              $ref: '#/components/schemas/DateTime'
    PollRequest:
      description: >-
        Poll request to kick off the poll process, received via webhook from CheckMate AI Platform
      allOf:
        - $ref: '#/components/schemas/BaseDocument'
        - type: object
          properties:
            checkId:
              type: string
              description: >-
                Check ID from CheckMate AI platform 
            text: 
              type: string
              nullable: true
              description: >-
                Text of the poll, if any
            imageURL: 
              type: string
              nullable: true
              description: >-
                URL of the image in the poll, if any 
            caption: 
              type: string
              nullable: true 
              description: >-
                Caption of the poll, if any 
            longformResponse: 
              $ref: '#/components/schemas/Response'
            shortformResponse:
              $ref: '#/components/schemas/Response'
        
              
    Vote:
      description: >-
        Representation of individual vote on a message 
      allOf:
        - $ref: '#/components/schemas/BaseDocument'
        - type: object
          properties:
            pollId: 
              $ref: '#/components/schemas/MongoObjectId'
            checkerId: 
              $ref: '#/components/schemas/MongoObjectId'
            createTimestamp:
              $ref: '#/components/schemas/DateTime'
            votedTimestamp:
              anyOf:
                - $ref: '#/components/schemas/DateTime'
                - nullable: true
            category:
              anyOf:
                - $ref: '#/components/schemas/Category'
                - nullable: true
            truthScore: 
              $ref: '#/components/schemas/TruthScore'
            responseCategory:
              $ref: '#/components/schemas/ResponseCategory'
            commentOnResponse:
              type: string
              nullable: true
    
    VotePOST:
      description: >-
        POST reqeust body to update the Vote Content of user 
      type: object
      properties:
        category: 
          anyOf:
            - $ref: '#/components/schemas/Category'
            - nullable: true 
        truthScore:
          allOf:
            - $ref: '#/components/schemas/TruthScore'
        responseCategory:
          $ref: '#/components/schemas/ResponseCategory'
        commentOnResponse:
          type: string
      required:
        - category
        - responseCategory
    
    VotesMessageBrief:
      description: >-
        Representation of individual vote with ALL votes details 
      allOf:
        - $ref: '#/components/schemas/Vote'
        - type: object
          properties:
            text: 
              type: string
              nullable: true
              description: >-
                Text of the poll, if any
            imageURL: 
              type: string
              nullable: true
              description: >-
                URL of the image in the poll, if any 
            crowdSourcedCategory:
              $ref: '#/components/schemas/Category'
    
    Leaderboard:
      type: object
      required:
        - _id
        - checkerName
        - numberOfVotes 
        - totalScore 
        - averageResponseTime 
        - accuracy 
        - correctVotes
      properties:
        _id: 
          type: string 
          description: Checkers Ids 
        checkerName:
          type: string 
          description: Name from the checkers collection 
        numberOfVotes:
          type: integer
          description: Total count of votes 
        totalScore:
          type: number 
          description: Sum of all scores 
        averageResponseTime:
          type: number 
          format: float 
          description: Average response time in hours 
        accuracy:
          type: number 
          format: float 
          description: Percentage (0-100), rounded to 2 d.p. 
        correctVotes:
          type: integer 
          description: Count of votes where isCorrect = true 

              
    PaginationTotal:
      description: the count of the total number of records
      type: integer
      example: 100
    PaginationLimit:
      description: The maximum number of items returned in the response.
      type: integer
      example: 100
    PaginationOffset:
      description: The number of items to skipped starting to collect the items.
        The offset must be a non-negative integer.
      type: integer
      example: 100
      
    PaginationResponse:
      description: Pagination Response structure
      type: object
      properties:
        total:
          $ref: '#/components/schemas/PaginationTotal'
        offset:
          $ref: '#/components/schemas/PaginationOffset'
        limit:
          $ref: '#/components/schemas/PaginationLimit'
          
    APIPagination:
      description: Representation of a Paginated Response
      type: object
      properties:
        total:
          description: Total number of objects
          type: number
          format: int32
          default: 0
        limit:
          description: Number of items per page
          type: integer
          format: int32
          minimum: 0
          maximum: 50
          exclusiveMaximum: false
        offset:
          description: Number of skipped items
          type: integer
          format: int32
          minimum: 0
            
              
  parameters:
    PaginationLimitParam:
      name: limit
      description: Number of items per page
      in: query
      required: false
      schema:
        type: number
        format: int32
        default: 50
        minimum: 0
    PaginationOffsetParam:
      name: offset
      description: Number of items skipped
      in: query
      required: false
      schema:
        type: number
        format: int32
        default: 0
        minimum: 0
        
  # Definition of Responses
  responses:
    CreatedResponse:
      description: Successfully created resource with ID
      content:
        application/json:
          schema:
            description: Generated resource ID 
            type: object
            properties:
              id:
                description: Unique ID of the resource 
                type: string
                format: uuid
            required:
              - id 
    UpdatedResponse:
      description: Successfully updated specified resource
    DeletedResponse:
      description: Successfully deleted specified resource(s)
    TriggeredResponse:
      description: Successfully triggered an activity
    InvalidParametersError:
      description: Invalid parameter(s)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
          example:
            code: 400
            message: Invalid parameters provided
    AuthenticationError:
      description: Authentication error
      content: 
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
          example:
            code: 401
            message: Unauthorised usage of the API
    PermissionsError:
      description: Insufficient permissions error
      content: 
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
          example:
            code: 403
            message: Insufficient permissions to use API
    NotFoundError:
      description: Specified resource(s) was not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
          example:
            code: 404
            message: Specified resource(s) was not found
    DuplicateEntryError:
      description: Duplicate entry
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
          example:
            code: 409
            message: Attempt to create duplicate entry
    UnsupportedMediaTypeError:
      description: Unsupported media content was uploaded 
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
          example:
            code: 415
            message: Unsupported media content was uploaded to the server
    InvalidCreationError:
      description: Unable to create resource due to errors
      content: 
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
          example:
            code: 422
            message: Unable to create resource
    InvalidUpdateError:
      description: Unable to update resource due to errors
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
          example:
            code: 422
            message: Unable to update resource
    InvalidDeletionError:
      description: Unable to delete resource as preconditions were not met
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
          example:
            code: 422
            message: Unable to delete resource
    RateLimitError:
      description: API was called too man times
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
          example: 
            code: 429
            message: API was invoked too many times
    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/APIError'
          example:
            code: 500
            message: Internal server error
    
        
        
        
          
          
          
          
          
          
          
          
          
          
          
          
          
          
    
  